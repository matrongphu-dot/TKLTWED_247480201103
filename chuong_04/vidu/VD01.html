<body>
    <h1>tu hoc javascript</h1>
    <script>
        var x, y, diem, xeploai;
        x = 6;
        y = 9;
        diem = (x+y)/2;
        document.write("ket qua cua phep tinh: ");
        document.write(diem);
        if(diem>=8.5) {
            xeploai="Gioi";
        }
        else if(diem>=7) {
            xeploai="Kha";
        }
        else if(diem>=5) {
            xeploai="TB";
        }
        else{
            xeploai="yeu";
        }
        document.write(xeploai);
    </script>
</body>
