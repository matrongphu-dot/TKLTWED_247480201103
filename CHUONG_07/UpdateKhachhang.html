<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Khách Hàng</title>
</head>
<body>
    <h2>Cập Nhật Thông Tin Khách Hàng</h2>
    <form action="UpdateKhachhang.php" method="POST">
        <label>Mã khách hàng cần sửa (makh):</label><br>
        <input type="text" name="makh" required><br><br>
        
        <label>Tên khách hàng mới (tenkh):</label><br>
        <input type="text" name="tenkh" required><br><br>
        
        <label>Năm sinh mới (namsinh):</label><br>
        <input type="number" name="namsinh" required><br><br>
        
        <label>Điện thoại mới (dienthoai):</label><br>
        <input type="text" name="dienthoai" required><br><br>

        <label>Địa chỉ mới (diachi):</label><br>
        <input type="text" name="diachi" required><br><br>
        
        <button type="submit" name="submit">Cập nhật khách hàng</button>
    </form>
</body>
</html>
