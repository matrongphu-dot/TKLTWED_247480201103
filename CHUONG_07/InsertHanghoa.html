<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Hàng Hóa</title>
</head>
<body>
    <h2>Thêm Hàng Hóa Mới</h2>
    <form action="InsertHanghoa.php" method="POST">
        <label>Mã hàng (mahang):</label><br>
        <input type="text" name="mahang" required><br><br>
        
        <label>Tên hàng (tenhang):</label><br>
        <input type="text" name="tenhang" required><br><br>
        
        <label>Mã nhà sản xuất (mansx):</label><br>
        <input type="text" name="mansx" required><br><br>
        
        <label>Năm sản xuất (namsx):</label><br>
        <input type="number" name="namsx" required><br><br>

        <label>Giá bán (gia):</label><br>
        <input type="number" name="gia" required><br><br>
        
        <button type="submit" name="submit">Thêm hàng hóa</button>
    </form>
</body>
</html>
